[package]
name = "ubuntu-info-rust"
version = "0.3.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/canonical/ubuntu-info-rust"
description = "Ubuntu distribution information modeled for Rust applications"

[features]
serde = ["dep:serde"]

[dependencies]
phf = { version = "0.14", features = ["macros"] }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
