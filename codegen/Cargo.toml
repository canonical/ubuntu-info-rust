[package]
name = "codegen"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Generates ubuntu-info-rust's series data from distro-info-data"
publish = false

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["parsing"] }
