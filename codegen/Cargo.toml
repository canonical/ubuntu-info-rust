[package]
name = "codegen"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Generates ubuntu-info-rust's series data from distro-info-data"
publish = false
default-run = "codegen"

[dependencies]
iso3166-static = { version = "=0.4.3", default-features = false }
clap = { version = "4", features = ["derive"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["parsing"] }
syn = { version = "2", default-features = false, features = ["full", "parsing"] }

[dev-dependencies]
tempfile = "3"
