name: Check and Update Distro Data

on:
  schedule:
    # Run every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-series-data:
    name: Regenerate series data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The upstream distro-info-data repository on git.launchpad.net requires
      # authentication, but the Ubuntu packaging repository for the
      # distro-info-data source package serves ubuntu.csv anonymously and is
      # kept up to date with every upload.
      - name: Download ubuntu.csv from distro-info-data
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 60 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "https://git.launchpad.net/ubuntu/+source/distro-info-data/plain/ubuntu.csv" \
            --output /tmp/ubuntu.csv

      - name: Regenerate src/series.rs
        id: generate
        run: |
          summary=$(cargo run --locked --package codegen -- /tmp/ubuntu.csv src/series.rs)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          cargo fmt

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- src/series.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "src/series.rs is already up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- src/series.rs
          fi

      - name: Run test suite
        if: steps.changes.outputs.changed == 'true'
        run: cargo test --workspace --locked --all-targets --all-features

      # The summary contains upstream-derived text. Pass it through an
      # environment variable and a file so it is never interpolated directly
      # into a workflow expression.
      - name: Prepare pull request body
        if: steps.changes.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.generate.outputs.summary }}
        run: |
          cat > /tmp/pr-body.md <<EOF
          Automated sync with upstream [distro-info-data][upstream].

          [upstream]: https://git.launchpad.net/ubuntu/+source/distro-info-data

          \`src/series.rs\` is regenerated by the idempotent \`codegen\` tool from
          the upstream \`ubuntu.csv\`. This pull request exists because the
          upstream data changed.

          ${SUMMARY}
          EOF

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): sync series metadata with distro-info-data"
          title: "chore(data): sync series metadata with distro-info-data"
          body-path: /tmp/pr-body.md
          branch: "automation/update-distro-info"
          delete-branch: true